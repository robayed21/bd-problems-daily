name: Daily Problem Broadcast

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = প্রতিদিন সকাল ৬টা (ঢাকা সময়)
  workflow_dispatch:       # Actions ট্যাব থেকে হাতে রান করা যাবে

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily problem to Telegram
        run: node script.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
